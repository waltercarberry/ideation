  <style>
:root{--navy:#08111F;--navy2:#0D192A;--paper:#F7F5F0;--paper2:#FFFDF9;--ink:#132033;--muted:#6F7B8C;--line:#D9DDE4;--blue:#45A3FF;--blue2:#DCEEFF;--amber:#F4B740;--amber2:#FFF1CF;--red:#F06A6A;--red2:#FFE0E0;--green:#52C79A;--green2:#DDF7ED;--white:#fff;--shadow:0 14px 40px rgba(8,17,31,.08);--radius:16px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:236px 1fr}.rail{background:var(--navy);color:#d9e3ef;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.wordmark{font-weight:700;letter-spacing:-.04em;font-size:24px;color:#fff;padding:4px 10px 28px}.wordmark span{color:var(--blue)}.steps{display:flex;flex-direction:column;gap:6px}.step{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#91a0b4;text-align:left;padding:12px 10px;border-radius:11px;width:100%}.step:hover{background:#132239;color:#fff}.step.active{background:#142941;color:#fff}.step.done{color:#d8e9f7}.stepnum{width:28px;height:28px;border:1px solid #30445d;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700}.step.active .stepnum{background:var(--blue);border-color:var(--blue);color:#07111d}.stepcopy strong{display:block;font-size:12px}.stepcopy small{display:block;color:#718198;margin-top:2px}.rail-footer{margin-top:auto;border-top:1px solid #21334a;padding:16px 10px;color:#75859a;font-size:11px;line-height:1.5}.main{min-width:0}.topbar{height:72px;background:rgba(255,253,249,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:10}.topbar-left{display:flex;align-items:center;gap:12px}.demo-name{font-weight:600}.stat n p{color:#aebdd0;margin:0;line-height:1.5}.score-bars{display:grid;gap:11px;margin-top:18px}.barrow{display:grid;grid-template-columns:140px 1fr 40px;gap:10px;align-items:center;font-size:11px}.bar{height:8px;background:#26384f;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}.barrow.low .bar i{background:var(--red)}.barrow.mid .bar i{background:var(--amber)}.action{border:1px solid var(--line);border-radius:13px;background:var(--paper2);margin-bottom:10px;overflow:hidden}.action-head{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:15px}.priority{width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}.action-title{font-weight:700}.action-sub{font-size:11px;color:var(--muted);margin-top:3px}.action-body{padding:0 15px 15px 61px;display:none}.action.open .action-body{display:block}.action-body p{line-height:1.5;color:#526174}.action-body ul{margin:8px 0;padding-left:18px;color:#526174;font-size:12px;line-height:1.6}.action-controls{display:flex;gap:7px;align-items:center}.check{appearance:none;width:16px;height:16px;border:1px solid #aab4c2;border-radius:4px}.check:checked{background:var(--green);border-color:var(--green)}.brief{padding:30px;max-width:950px}.brief-header{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:20px}.brief-title{font-size:28px;letter-spacing:-.04em}.brief-score{font-size:40px;font-weight:700;color:var(--navy)}.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.brief-section h4{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#718198}.brief-section ul{padding-left:18px;margin:0;line-height:1.7}.assumption{font-size:11px;color:#5c6b7e;padding:8px 0;border-top:1px solid #e6e8ed}.drawer-backdrop{position:fixed;inset:0;background:rgba(8,17,31,.38);z-index:30;display:none}.drawer-backdrop.show{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(500px,92vw);background:var(--paper2);padding:28px;overflow:auto;box-shadow:-15px 0 45px rgba(8,17,31,.2)}.drawer-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.drawer h2{margin:0;font-size:21px;letter-spacing:-.03em}.close{border:0;background:#edf0f4;border-radius:9px;width:34px;height:34px;font-weight:700}.detail{margin-top:20px}.detail h4{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#758196;margin:17px 0 6px}.detail p{line-height:1.55;margin:0;color:#425167}.modal-backdrop{position:fixed;inset:0;background:rgba(8,17,31,.45);z-index:40;display:none;place-items:center;padding:20px}.modal-backdrop.show{display:grid}.modal{background:var(--paper2);width:min(620px,95vw);max-height:90vh;overflow:auto;border-radius:18px;padding:25px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.modal h2{margin:0 0 18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#617087}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;outline:none}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dceeff}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.context{padding:20px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chip{border:1px solid #cfd6df;background:#f5f7f9;border-radius:999px;padding:7px 9px;font-size:10px}.print-only{display:none}.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 15px;border-radius:10px;font-size:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;z-index:60}.toast.show{opacity:1;transfo <body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
const demo = {
  bidName:'Aster Advisory — Northstar Digital Transformation Proposal',
  rfpName:'Northstar Council — Digital Service Transformation Partner',
  objective:'Modernise resident-facing digital services while reducing delivery risk, improving accessibility and creating measurable operational savings.',
  criteria:[
    {id:'c1',title:'Understanding of requirements',weight:20,coverage:'strong',risk:'low',source:'RFP §2',requirementText:'Demonstrate a clear understanding of Northstar Council’s transformation ambition, resident needs and service outcomes.',evidence:['Proposal §2 — Executive approach','Resident service principles'],missing:'No material gap identified.',why:'Shows the bid is aligned to the strategic brief.'},
    {id:'c2',title:'Delivery methodology',weight:25,coverage:'partial',risk:'high',source:'RFP §4',requirementText:'Set out a credible delivery and mobilisation methodology, including transition, milestones, ownership and controls.',evidence:['Proposal §4 — Phased approach'],missing:'No named mobilisation owner or 90-day transition plan.',why:'The room needs confidence that delivery can start cleanly and predictably.'},
    {id:'c3',title:'Relevant experience',weight:20,coverage:'strong',risk:'low',source:'RFP §5',requirementText:'Provide relevant evidence of comparable digital transformation work and measurable outcomes.',evidence:['Case study 1 — Local authority transformation','Case study 2 — Digital service redesign'],missing:'Comparable transition evidence is limited.',why:'Relevant proof reduces perceived delivery risk.'},
    {id:'c4',title:'Team and governance',weight:15,coverage:'partial',risk:'medium',source:'RFP §6',requirementText:'Describe the proposed team, governance structure, decision rights and escalation routes.',evidence:['Proposal §6 — Governance'],missing:'Governance language is generic and ownership is not explicit.',why:'Operations and Risk need to know who is accountable when issues arise.'},
    {id:'c5',title:'Risk, assurance and accessibility',weight:10,coverage:'weak',risk:'high',source:'RFP §7',requirementText:'Explain risk management, assurance and accessibility testing sufficient to support safe service launch.',evidence:['Proposal §7 — Accessibility commitment'],missing:'Limited standards, testing and assurance detail.',why:'Risk can block approval if assurance is not defensible.'},
    {id:'c6',title:'Price and value',weight:10,coverage:'partial',risk:'medium',source:'RFP §8',requirementText:'Present a plausible commercial model and connect price to measurable value and benefits.',evidence:['Commercial response — pricing table'],missing:'Benefits are qualitative; value-for-money logic is weak.',why:'Finance must justify every pound and Procurement needs scoring defensibility.'}
  ],
  findings:[
    {id:'s1',type:'strength',title:'Strong strategic alignment',description:'The proposal clearly understands the Council’s transformation ambition.',source:'Proposal §2',affected:['Executive Sponsor'],severity:'low',recommendedAction:''},
    {id:'s2',type:'strength',title:'Relevant transformation experience',description:'Case study evidence is credible and directly related to digital service change.',source:'Case study 1',affected:['Executive Sponsor','Operations Lead'],severity:'low',recommendedAction:''},
    {id:'s3',type:'strength',title:'Clear phased approach',description:'The response gives the room a sensible high-level sequence for delivery.',source:'Proposal §4',affected:['Procurement Lead'],severity:'low',recommendedAction:''},
    {id:'w1',type:'weakness',title:'Benefits are not quantified',description:'Benefits are described qualitatively without a baseline, target, owner or measurement date.',source:'Commercial response',affected:['Finance Director','Procurement Lead'],severity:'high',recommendedAction:'Quantify benefits and define the measurement method.'},
    {id:'w2',type:'weakness',title:'Mobilisation ownership is unclear',description:'There is no named owner or explicit 90-day transition plan.',source:'Proposal §4',affected:['Operations Lead','Risk and Assurance Lead'],severity:'high',recommendedAction:'Name the mobilisation owner and add 90-day milestones.'},
    {id:'w3',type:'weakness',title:'Governance language is generic',description:'Governance is described at a principle level rather than through explicit decision rights.',source:'Proposal §6',affected:['Operations Lead','Risk and Assurance Lead'],severity:'medium',recommendedAction:'Add named roles, decision rights and escalation routes.'},
    {id:'w4',type:'weakness',title:'Accessibility assurance is underdeveloped',description:'Accessibility is mentioned, but standards and testing approach are thin.',source:'Proposal §7',affected:['Risk and Assurance Lead','Technical Evaluator'],severity:'medium',recommendedAction:'Strengthen accessibility standards and testing approach.'},
    {id:'w5',type:'weakness',title:'Price/value case is not sufficiently connected',description:'The price is plausible, but the value story does not make the investment easy to defend.',source:'Commercial response',affected:['Finance Director','Executive Sponsor'],severity:'medium',recommendedAction:'Connect price to measurable benefits in a simple value table.'},
    {id:'w6',type:'weakness',title:'Evidence does not show a comparable transition',description:'The case studies prove transformation experience but not enough comparable mobilisation detail.',source:'Case study 1',affected:['Operations Lead','Executive Sponsor'],severity:'medium',recommendedAction:'Add a comparable transition case study.'}
  ],
  evaluators:[
    {id:'e1',role:'Executive Sponsor',initials:'ES',objective:'Visible transformation impact',influence:'high',stance:'supportive',veto:false,score:82,concerns:['Benefits need a sharper outcome story'],rewards:['Strategic alignment','Transformation ambition'],challenges:['Quantification'],questions:['What will the CEO be able to point to in 90 days?'],scoreChangingEvidence:'A concise benefits baseline and target.',sourceType:'ai-inferred'},
    {id:'e2',role:'Procurement Lead',initials:'PL',objective:'Evidence and scoring defensibility',influence:'high',stance:'neutral',veto:false,score:74,concerns:['Unsupported claims','Weak value linkage'],rewards:['Relevant evidence','Clear response to rubric'],challenges:['Claims without proof'],questions:['Where is the evidence for each major claim?'],scoreChangingEvidence:'Mapped evidence and measurable benefits.',sourceType:'rfp-grounded'},
    {id:'e3',role:'Risk and Assurance Lead',initials:'RA',objective:'Assurance and failure modes',influence:'high',stance:'cautious',veto:true,score:63,concerns:['Accessibility assurance','Mobilisation controls'],rewards:['Clear controls','Named accountability'],challenges:['Unclear ownership'],questions:['Who owns mobilisation and how will accessibility be tested?'],scoreChangingEvidence:'90-day plan plus testing/assurance standards.',sourceType:'ai-inferred'},
    {id:'e4',role:'Operations Lead',initials:'OL',objective:'Delivery certainty',influence:'medium',stance:'cautious',veto:false,score:61,concerns:['Mobilisation accountability','Transition evidence'],rewards:['Phased approach','Relevant experience'],challenges:['Operational detail'],questions:['Who is accountable in the first 90 days?'],scoreChangingEvidence:'Named mobilisation owner and milestones.',sourceType:'ai-inferred'},
    {id:'e5',role:'Finance Director',initials:'FD',objective:'Quantified value',influence:'high',stance:'sceptical',veto:false,score:54,concerns:['No quantified benefits','Weak value-for-money logic'],rewards:['Plausible price'],challenges:['Qualitative benefits'],questions:['What baseline, target and measurement date support the savings claim?'],scoreChangingEvidence:'Benefits table with baseline, target, owner and date.',sourceType:'user-supplied'},
    {id:'e6',role:'Technical Evaluator',initials:'TE',objective:'Integration detail',influence:'medium',stance:'neutral',veto:false,score:68,concerns:['Integration assurance','Accessibility testing'],rewards:['Clear service approach'],challenges:['Thin technical detail'],questions:['How will integration and accessibility be tested?'],scoreChangingEvidence:'Testing approach and technical acceptance criteria.',sourceType:'ai-inferred'}
  ],
  actions:[
    {id:'a1',priority:1,title:'Quantify benefits and measurement method',rationale:'Finance and Procurement need a defensible value case, not qualitative promises.',evaluators:['Finance Director','Procurement Lead'],impact:'high',evidence:['Baseline','Target','Owner','Measurement date'],reviewed:false},
    {id:'a2',priority:2,title:'Name mobilisation owner and 90-day milestones',rationale:'Operations and Risk cannot see who owns the transition or how control will work.',evaluators:['Operations Lead','Risk and Assurance Lead'],impact:'high',evidence:['Named owner','90-day delivery plan'],reviewed:false},
    {id:'a3',priority:3,title:'Add comparable transition case study',rationale:'Existing evidence proves transformation capability but not enough comparable mobilisation.',evaluators:['Operations Lead','Executive Sponsor'],impact:'medium',evidence:['Client example','Transition outcomes'],reviewed:false},
    {id:'a4',priority:4,title:'Strengthen accessibility assurance',rationale:'Risk and Technical need standards and testing detail that can withstand scrutiny.',evaluators:['Risk and Assurance Lead','Technical Evaluator'],impact:'medium',evidence:['Standards','Testing approach'],reviewed:false},
    {id:'a5',priority:5,title:'Connect price to measurable value',rationale:'A simple benefits table will make the commercial story easier to defend.',evaluators:['Finance Director','Executive Sponsor'],impact:'medium',evidence:['Benefits table'],reviewed:false}
  ],
  context:'The CEO wants a visible transformation win, but the CFO must justify every pound. Procurement is formal and will penalise unsupported claims. Operations is sceptical because a previous supplier overpromised. The technical lead cares about integration, while end users mainly want something simple.'
};

const state={stage:0,loaded:false,drawer:null,modal:null,hasRun:false,roles:JSON.parse(JSON.stringify(demo.evaluators)),actions:JSON.parse(JSON.stringify(demo.actions)),relationships:[['Executive Sponsor','supports','transformation ambition'],['Finance Director','challenges','unquantified value'],['Operations Lead','challenges','delivery certainty'],['Procurement Lead','follows','published rubric'],['Risk and Assurance Lead','can block','approval']]};
const stages=['Upload','RFP map','Bid review','Build the room','Boardroom','Action plan'];
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function badge(text,kind){return `<span class="badge ${kind}">${esc(text)}</span>`}
function stageNav(){return `<div class="steps">${stages.map((s,i)=>`<button class="step ${i===state.stage?'active':''} ${i<state.stage?'done':''}" onclick="go(${i})"><span class="stepnum">${String(i+1).padStart(2,'0')}</span><span class="stepcopy"><strong>${s}</strong><small>${i<state.stage?'Complete':i===state.stage?'Current':'Upcoming'}</small></span></button>`).join('')}</div>`}
function shell(content){return `<div class="shell"><aside class="rail"><div class="wordmark">Bid<span>room</span></div>${stageNav()}<div class="rail-footer">Structured simulation based on the RFP, proposal and your assumptions.<br><br>Not a prediction of the actual client decision.</div></aside><main class="main"><header class="topbar"><div class="topbar-left"><span class="status-dot"></span><span class="demo-name">${esc(demo.bidName)}</span><span class="muted">· Simulation: Draft 01</span></div><div class="top-actions"><button class="btn ghost" onclick="resetDemo()">Reset demo</button><button class="btn" onclick="printBrief()">Print brief</button></div></header><div class="content">${content}</div></main></div>${drawerHTML()}${modalHTML()}`}
function landing(){return `<div class="hero animate"><div class="eyebrow">Pre-submission bid stress test</div><h1>Will your proposal survive the client’s boardroom?</h1><p>Upload an RFP and draft bid. Map the evaluation criteria, model competing stakeholder priorities and find the reasons your proposal could lose before submission.</p><div class="upload-grid"><div class="upload-card"><div class="upload-icon">↑</div><h3>Upload RFP</h3><p>PDF, DOCX or text · simulated parse in this demo</p><input class="no-print" type="file" accept=".pdf,.doc,.docx,.txt" onchange="fakeUpload('RFP')"></div><div class="upload-card"><div class="upload-icon">↑</div><h3>Upload draft proposal</h3><p>PDF, DOCX or text · simulated parse in this demo</p><input class="no-print" type="file" accept=".pdf,.doc,.docx,.txt" onchange="fakeUpload('proposal')"></div></div><div class="hero-actions"><button class="btn dark" onclick="loadDemo()">Load demo bid</button><button class="btn primary" onclick="loadDemo();setTimeout(()=>go(4),80)">Enter the boardroom</button></div><div class="disclaimer">This is a structured simulation based on the RFP, proposal and your assumptions. It is not a prediction of the actual client decision.</div></div>`}
function rfpPage(){return `<div class="section-head animate"><div><div class="eyebrow">02 · RFP intelligence map</div><h1>What the client will score</h1><p>Extracted requirements are mapped to the proposal so you can see where the response is strong, partial or exposed.</p></div><button class="btn primary" onclick="go(2)">Review the bid →</button></div><div class="kpis">${[['Requirements extracted','42','RFP map'],['Mandatory requirements','9','RFP map'],['Weighted criteria','6','RFP map'],['Partially answered','7','Needs attention'],['High-risk gaps','3','Priority']].map((x,i)=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('')}</div><div class="card table-wrap"><table class="matrix"><thead><tr><th>Requirement</th><th>Weight</th><th>Coverage</th><th>Evidence / source</th><th>Risk</th></tr></thead><tbody>${demo.criteria.map(c=>`<tr onclick="openCriterion('${c.id}')"><td><div class="req-title">${esc(c.title)}</div><div class="req-sub">Click to inspect requirement evidence</div></td><td><strong>${c.weight}%</strong></td><td>${badge(c.coverage[0].toUpperCase()+c.coverage.slice(1),c.coverage==='strong'?'green':c.coverage==='partial'?'amber':'red')}</td><td>${esc(c.source)}</td><td>${badge(c.risk.toUpperCase(),c.risk==='low'?'green':c.risk==='medium'?'amber':'red')}</td></tr>`).join('')}</tbody></table></div>`}
function bidReview(){const strengths=demo.findings.filter(f=>f.type==='strength'),weak=demo.findings.filter(f=>f.type==='weakness');return `<div class="section-head animate"><div><div class="eyebrow">03 · Bid review</div><h1>The proposal answers the brief. It does not yet reassure the room.</h1><p>Strong strategic fit is being held back by operational and commercial uncertainty.</p></div><button class="btn primary" onclick="go(3)">Curate the room →</button></div><div class="score-hero card panel"><div class="score-ring"><span>68</span></div><div class="score-meta"><h2>Simulated competitiveness</h2><p><strong>Confidence: Medium</strong><br>Structured from the weighted criteria, proposal evidence and evaluator hypotheses. This is not a win probability.</p></div></div><div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="card kpi"><div class="label">Strengths</div><div class="value">5</div></div><div class="card kpi"><div class="label">Weaknesses</div><div class="value">6</div></div><div class="card kpi"><div class="label">Critical decision risks</div><div class="value">3</div></div></div><div class="grid2"><div class="card panel"><h3>What is working</h3>${strengths.map(finding).join('')}</div><div class="card panel"><h3>What could sink it</h3>${weak.map(finding).join('')}</div></div>`}
function finding(f){return `<div class="finding" onclick="openFinding('${f.id}')"><div class="icon ${f.type==='strength'?'green':'red'}">${f.type==='strength'?'✓':'!'}</div><div><strong>${esc(f.title)}</strong><p>${esc(f.description)}</p><div style="margin-top:7px">${badge(f.source,'dark')} ${f.affected.slice(0,2).map(x=>badge(x,'blue')).join(' ')}</div></div></div>`}
function buildRoom(){return `<div class="section-head animate"><div><div class="eyebrow">04 · Build the room</div><h1>You know the client. Curate the room.</h1><p>The AI can infer plausible evaluator roles, but you can encode what you know about priorities, pressures and internal tensions.</p></div><button class="btn primary" onclick="go(4)">Run the boardroom →</button></div><div class="card context"><h3 style="margin:0 0 7px">Decision context</h3><p style="margin:0;color:var(--muted);line-height:1.5">${esc(demo.context)}</p><div class="chips"><span class="chip">Budget pressure · User-supplied</span><span class="chip">Low tolerance for unsupported claims · User-supplied</span><span class="chip">Previous supplier disappointment · User-supplied</span><span class="chip">Integration concern · User-supplied</span><span class="chip">Simplicity valued by end users · User-supplied</span></div></div><div style="height:16px"></div><div class="boardroom"><div class="central card"><strong>Your bid</strong><div class="muted" style="font-size:11px;margin-top:5px">Aster Advisory · Draft 01</div></div><div class="role-grid">${state.roles.map(roleCard).join('')}</div></div><div style="margin-top:18px;display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Relationship map</h3><button class="btn" onclick="toggleRelationship()">Edit relationship</button></div><div class="card panel" style="margin-top:10px">${state.relationships.map((r,i)=>`<div style="padding:9px 0;border-top:${i?'1px solid #e6e8ed':'0'};font-size:12px"><strong>${esc(r[0])}</strong> <span class="muted">${esc(r[1])}</span> <strong>${esc(r[2])}</strong></div>`).join('')}</div><div style="margin-top:18px"><button class="btn dark" onclick="openRole()">+ Add evaluator</button></div>`}
function roleCard(r){return `<div class="card role-card"><div class="role-top"><div class="initials">${esc(r.initials)}</div><button class="btn" style="padding:6px 9px" onclick="openRole('${r.id}')">Edit</button></div><h3>${esc(r.role)}</h3><p>${esc(r.objective)}</p><div class="role-score">${r.score}<span class="muted" style="font-size:11px"> / 100</span></div><div class="role-meta">${badge(r.influence+' influence','dark')}${badge(r.stance,r.stance==='supportive'?'green':r.stance==='sceptical'?'red':'amber')}${r.veto?badge('Can veto','red'):''}</div></div>`}
function boardroom(){
  const max=Math.max(...state.roles.map(r=>r.score)), min=Math.min(...state.roles.map(r=>r.score));
  let out=`<div class="section-head animate"><div><div class="eyebrow">05 · Boardroom simulation</div><h1>The room is not one mind.</h1><p>These are simulated viewpoints based on the supplied RFP, proposal evidence and evaluator definitions.</p></div><button class="btn primary" onclick="runSimulation()">${state.hasRun?'Run again':'Run boardroom'}</button></div>`;
  out+=`<div class="boardroom card"><div class="boardroom-grid">${state.roles.map(roleCard).join('')}<div class="central card boardroom-center"><strong>Simulated panel</strong><div class="muted" style="font-size:11px;margin-top:5px">${state.hasRun?'Scored':'Ready to review'}</div></div></div></div>`;
  if(!state.hasRun){out+=`<div class="card panel" style="margin-top:18px;text-align:center"><p class="muted">Run the boardroom to activate the simulated evaluator scores, disagreement and decision friction.</p></div>`;return out}
  const msgs=[['EXECUTIVE SPONSOR','The proposal understands the transformation ambition.'],['FINANCE DIRECTOR','The benefits are not measurable enough to justify the investment.'],['OPERATIONS LEAD','I cannot see who owns mobilisation in the first 90 days.'],['PROCUREMENT LEAD','The response is relevant, but several claims are unsupported.'],['CHAIR','Keep in contention. Clarify value, ownership and assurance before submission.']];
  out+=`<div class="grid2" style="margin-top:18px"><div class="card transcript"><h3>Simulated discussion</h3>${msgs.map(m=>`<div class="msg"><strong>${m[0]}</strong><p>${m[1]}</p></div>`).join('')}</div><div class="card panel"><h3>Evaluator scores</h3><div class="score-bars">${state.roles.map(r=>`<div class="barrow ${r.score<65?'low':r.score<75?'mid':''}"><span>${esc(r.role)}</span><div class="bar"><i style="width:${r.score}%"></i></div><strong>${r.score}</strong></div>`).join('')}</div></div></div>`;
  out+=`<div class="friction"><h3>Decision friction · ${max-min} point spread</h3><p><strong style="color:#fff">Strategic enthusiasm is high, but financial confidence is low.</strong><br>Root cause: the bid describes benefits qualitatively without a baseline, target, owner or measurement date.<br><br>Secondary friction: Operations cannot see who is accountable during mobilisation.</p></div><div style="margin-top:18px;display:flex;justify-content:flex-end"><button class="btn primary" onclick="go(5)">Fix the reasons the room could say no →</button></div>`;
  return out;
}
function actionPlan(){return `<div class="section-head animate"><div><div class="eyebrow">06 · Action plan</div><h1>Fix the reasons the room could say no.</h1><p>Prioritised actions focus on the smallest set of changes likely to reduce decision friction. Bidroom does not rewrite the whole proposal for you.</p></div><button class="btn" onclick="printBrief()">Boardroom brief →</button></div><div class="card panel" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:20px"><div><div class="muted" style="font-size:11px">CURRENT SIMULATED COMPETITIVENESS</div><strong style="font-size:32px">68</strong></div><div style="font-size:25px;color:#aab3c0">→</div><div><div class="muted" style="font-size:11px">POTENTIAL AFTER TOP RISKS</div><strong style="font-size:32px">76</strong><div class="muted" style="font-size:10px">Illustrative impact, not a guarantee</div></div></div></div>${state.actions.map(a=>`<div class="action ${a.open?'open':''}" id="${a.id}"><div class="action-head"><div class="priority">${a.priority}</div><div onclick="toggleAction('${a.id}')" style="cursor:pointer"><div class="action-title">${esc(a.title)}</div><div class="action-sub">${a.evaluators.join(' · ')} · ${a.impact} impact</div></div><div class="action-controls"><button class="btn" onclick="copyAction('${a.id}')">Copy</button><label title="Mark reviewed"><input class="check" type="checkbox" ${a.reviewed?'checked':''} onchange="reviewAction('${a.id}',this.checked)"></label></div></div><div class="action-body"><p>${esc(a.rationale)}</p><strong style="font-size:11px">Evidence needed</strong><ul>${a.evidence.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div></div>`).join('')}<div class="brief card" style="margin-top:22px"><div class="brief-header"><div><div class="eyebrow">Boardroom brief</div><div class="brief-title">Competitive but exposed</div><div class="muted">${esc(demo.bidName)}</div></div><div style="text-align:right"><div class="brief-score">68</div><div class="muted">Simulated competitiveness</div></div></div><div class="brief-grid"><div class="brief-section"><h4>Top strengths</h4><ul><li>Strong strategic alignment</li><li>Relevant transformation experience</li><li>Clear phased approach</li></ul></div><div class="brief-section"><h4>Top decision risks</h4><ul><li>Unquantified benefits</li><li>Unclear mobilisation ownership</li><li>Thin assurance detail</li></ul></div><div class="brief-section"><h4>Evaluator spread</h4><ul><li>Executive Sponsor · 82</li><li>Finance Director · 54</li><li>Spread · 28 points</li></ul></div><div class="brief-section"><h4>Assumptions</h4><div class="assumption">Evaluator roles and stances are hypotheses, not real client employees.</div><div class="assumption">Scores are simulated from supplied evidence and role definitions.</div></div></div><div class="disclaimer" style="margin:22px 0 0;max-width:none">This is a structured simulation based on the RFP, proposal and your assumptions. It is not a prediction of the actual client decision.</div></div>`}
function render(){let body=[landing,rfpPage,bidReview,buildRoom,boardroom,actionPlan][state.stage]();app.innerHTML=shell(body)}
function go(i){state.stage=Math.max(0,Math.min(5,i));render();window.scrollTo({top:0,behavior:'smooth'})}
function loadDemo(){state.loaded=true;state.stage=1;state.hasRun=false;state.roles=JSON.parse(JSON.stringify(demo.evaluators));state.actions=JSON.parse(JSON.stringify(demo.actions));render();toast('Northstar demo bid loaded')}
function resetDemo(){state.stage=0;state.loaded=false;state.hasRun=false;state.roles=JSON.parse(JSON.stringify(demo.evaluators));state.actions=JSON.parse(JSON.stringify(demo.actions));render();toast('Demo reset')}
function fakeUpload(type){toast(`${type} upload staged — using demo parser for this prototype`)}
function openCriterion(id){state.drawer={type:'criterion',id};render();}
function openFinding(id){state.drawer={type:'finding',id};render();}
function openRole(id){state.modal={type:'role',id:id||null};render()}
function toggleRelationship(){state.relationships[1][1]=state.relationships[1][1]==='challenges'?'supports':'challenges';render();toast('Relationship updated')}
function runSimulation(){const btn=document.querySelector('.section-head .btn.primary');if(btn){btn.disabled=true;btn.textContent='Reviewing…'}setTimeout(()=>{state.hasRun=true;render();toast('Boardroom simulation complete')},1700)}
function toggleAction(id){const a=state.actions.find(x=>x.id===id);a.open=!a.open;render()}
function reviewAction(id,val){const a=state.actions.find(x=>x.id===id);a.reviewed=val;toast(val?'Action marked reviewed':'Action reopened')}
function copyAction(id){const a=state.actions.find(x=>x.id===id);const text=`${a.title}\nEvaluators: ${a.evaluators.join(', ')}\nImpact: ${a.impact}\nEvidence needed: ${a.evidence.join(', ')}`;navigator.clipboard?.writeText(text);toast('Action copied')}
function printBrief(){window.print()}
function drawerHTML(){if(!state.drawer)return '';let title='',body='';if(state.drawer.type==='criterion'){const c=demo.criteria.find(x=>x.id===state.drawer.id);title=c.title;body=`<div class="detail">${badge('RFP-grounded','blue')}<h4>Exact requirement</h4><p>${esc(c.requirementText)}</p><h4>RFP section / source</h4><p>${esc(c.source)}</p><h4>Proposal evidence</h4><p>${c.evidence.map(esc).join('<br>')}</p><h4>Missing evidence</h4><p>${esc(c.missing)}</p><h4>Why it matters</h4><p>${esc(c.why)}</p><h4>Coverage / risk</h4><p>${badge(c.coverage,'dark')} ${badge(c.risk,'dark')}</p></div>`}else{const f=demo.findings.find(x=>x.id===state.drawer.id);title=f.title;body=`<div class="detail">${badge(f.type==='strength'?'User-supplied / proposal evidence':'AI-inferred finding',f.type==='strength'?'green':'amber')}<h4>Problem / finding</h4><p>${esc(f.description)}</p><h4>Where detected</h4><p>${esc(f.source)}</p><h4>Why it matters</h4><p>${f.affected.map(x=>esc(x)).join(', ')} are affected.</p><h4>Recommended action</h4><p>${esc(f.recommendedAction||'No action required.')}</p><h4>Assumption</h4><p>This is a structured evaluator hypothesis, not a statement about a real client employee.</p></div>`}return `<div class="drawer-backdrop show" onclick="if(event.target===this){state.drawer=null;render()}"><aside class="drawer"><div class="drawer-head"><div><div class="eyebrow">Evidence / assumption</div><h2>${esc(title)}</h2></div><button class="close" onclick="state.drawer=null;render()">×</button></div>${body}</aside></div>`}
function modalHTML(){if(!state.modal)return '';const r=state.roles.find(x=>x.id===state.modal.id);const isNew=!r;const role=r||{role:'',objective:'',influence:'medium',stance:'neutral',veto:false,concerns:[],rewards:[],challenges:[],score:65,initials:'EV'};return `<div class="modal-backdrop show" onclick="if(event.target===this){state.modal=null;render()}"><div class="modal"><div style="display:flex;justify-content:space-between"><h2>${isNew?'Add evaluator':'Edit evaluator'}</h2><button class="close" onclick="state.modal=null;render()">×</button></div><div class="formgrid"><div class="field full"><label>Role name</label><input id="f-role" value="${esc(role.role)}"></div><div class="field full"><label>Primary objective</label><input id="f-objective" value="${esc(role.objective)}"></div><div class="field"><label>Influence</label><select id="f-influence">${['high','medium','low'].map(v=>`<option ${v===role.influence?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Stance</label><select id="f-stance">${['supportive','neutral','cautious','sceptical'].map(v=>`<option ${v===role.stance?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Secondary concerns</label><input id="f-concerns" value="${esc(role.concerns.join(', '))}"></div><div class="field full"><label>Likely to reward</label><input id="f-rewards" value="${esc(role.rewards.join(', '))}"></div><div class="field full"><label>Likely to challenge</label><input id="f-challenges" value="${esc(role.challenges.join(', '))}"></div><div class="field full"><label>Notes / context</label><textarea id="f-notes">${esc(role.notes||'')}</textarea></div><div class="field"><label>Can veto?</label><select id="f-veto"><option value="false" ${!role.veto?'selected':''}>No</option><option value="true" ${role.veto?'selected':''}>Yes</option></select></div><div class="field"><label>Current score</label><input id="f-score" type="number" min="0" max="100" value="${role.score}"></div></div><div class="modal-actions"><button class="btn" onclick="state.modal=null;render()">Cancel</button><button class="btn primary" onclick="saveRole('${state.modal.id||''}')">Save evaluator</button></div></div></div>`}
function saveRole(id){const data={role:document.getElementById('f-role').value||'Unnamed evaluator',objective:document.getElementById('f-objective').value||'Unspecified objective',influence:document.getElementById('f-influence').value,stance:document.getElementById('f-stance').value,veto:document.getElementById('f-veto').value==='true',score:Number(document.getElementById('f-score').value)||65,concerns:document.getElementById('f-concerns').value.split(',').map(s=>s.trim()).filter(Boolean),rewards:document.getElementById('f-rewards').value.split(',').map(s=>s.trim()).filter(Boolean),challenges:document.getElementById('f-challenges').value.split(',').map(s=>s.trim()).filter(Boolean),notes:document.getElementById('f-notes').value,sourceType:'user-supplied'};data.initials=data.role.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();if(id){Object.assign(state.roles.find(x=>x.id===id),data)}else{data.id='e'+Date.now();state.roles.push(data)}state.modal=null;render();toast('Evaluator saved')}
render();

  </script>
</body>
</html>
